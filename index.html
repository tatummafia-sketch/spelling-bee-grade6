<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Bee Master – Grade 6</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8e1;--card:#fff;--ink:#2b2216;--mute:#7a6a4f;--honey:#ffc211;--honey-d:#b8860b;--ok:#2e9e5b;--bad:#d94f3d;--line:#f0dca0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a10;--card:#2b2517;--ink:#fff3cf;--mute:#c8b685;--honey-d:#ffc211;--line:#4a3f22}}
:root[data-theme="dark"]{--bg:#1e1a10;--card:#2b2517;--ink:#fff3cf;--mute:#c8b685;--honey-d:#ffc211;--line:#4a3f22}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mali',system-ui,'Noto Sans Thai','Leelawadee UI',sans-serif;line-height:1.5;min-height:100vh}
.stripe{height:14px;background:repeating-linear-gradient(135deg,var(--honey) 0 18px,#2b2216 18px 36px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2rem;margin:.2em 0;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--honey-d);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;background:var(--honey);color:#2b2216;cursor:pointer}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
button:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.turn{font-size:1.25rem;font-weight:700;margin:0 0 4px}
.meta{color:var(--mute);font-size:.9rem}
.hint dt{font-weight:700;color:var(--honey-d);font-size:.9rem;margin-top:10px}
.hint dd{margin:0;font-size:1.1rem}
.thai{font-size:1.5rem;font-weight:700}
.slots{letter-spacing:.25em;font-size:1.3rem;font-weight:700}
.fb{padding:14px;border-radius:14px;font-weight:600;margin-top:12px}
.fb.ok{background:rgba(46,158,91,.18);border:2px solid var(--ok)}
.fb.bad{background:rgba(217,79,61,.15);border:2px solid var(--bad)}
.score{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:4px 12px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-size:.9rem}
.chip.on{background:var(--honey);color:#2b2216;border-color:var(--honey-d);font-weight:700}
table{width:100%;border-collapse:collapse}td{padding:10px 8px;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:700}
.win{font-size:1.4rem;text-align:center;font-weight:700}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .25s}@keyframes pop{from{transform:scale(.96);opacity:0}}}
</style></head><body>
<div class="stripe"></div>
<main>
<h1>🐝 Spelling Bee Master</h1>
<p class="sub">Grade 6 Vocabulary · Maths · Science · Social Studies · Language</p>

<section id="setup" class="card">
<p style="margin-top:0">สวัสดีครับนักสะกดคำทุกคน! มาแข่งกันว่าใครสะกดเก่งที่สุด 🎉 บอกจำนวนผู้เล่น ชื่อ และจำนวนรอบได้เลย</p>
<div class="row"><div><label for="np">จำนวนผู้เล่น</label>
<select id="np"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div><label for="nr">จำนวนรอบ</label>
<select id="nr"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></div></div>
<div id="names"></div>
<button id="start" style="width:100%;margin-top:16px">เริ่มเกม!</button>
</section>

<section id="game" class="hidden">
<div class="score" id="chips" aria-label="คะแนน"></div>
<div class="card">
<p class="turn" id="who"></p>
<p class="meta" id="prog"></p>
<dl class="hint">
<dt>หมวดวิชา (Subject)</dt><dd id="h-sub"></dd>
<dt>ชนิดของคำ (Parts of Speech)</dt><dd id="h-pos"></dd>
<dt>English Definition</dt><dd id="h-en"></dd>
<dt>Thai Definition</dt><dd class="thai" id="h-th"></dd>
</dl>
<p class="slots hidden" id="slots"></p>
</div>
<div class="card" id="answerBox">
<label for="ans">พิมพ์คำศัพท์ภาษาอังกฤษที่สะกดให้ถูกต้อง</label>
<input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์คำตอบที่นี่">
<div class="row" style="margin-top:12px"><button id="check">ส่งคำตอบ</button><button id="len" class="ghost">ใบ้จำนวนตัวอักษร</button></div>
<div id="fb" aria-live="polite"></div>
</div>
<button id="next" class="hidden" style="width:100%">ไปต่อ</button>
</section>

<section id="end" class="card hidden">
<p class="win" id="winner"></p>
<table id="board"></table>
<button id="again" style="width:100%;margin-top:16px">เล่นอีกครั้ง</button>
</section>
</main>

<script>
// subject|pos|word|English definition|Thai  (from Vocabulary Book Grade 6)
const RAW=`M|N.|factor|Numbers we can multiply together to get another number.|ตัวประกอบ
M|N.|multiple|The product result of one number multiplied by another number.|ผลคูณ
M|N.|divisor|The number we divide by.|ตัวหาร
M|N.|fraction|A part of a whole.|เศษส่วน
M|N.|numerator|The top number in a fraction.|ตัวเศษ
M|N.|denominator|The bottom number in a fraction.|ตัวส่วน
M|N.|remainder|A leftover amount after division.|เศษ
M|N.|exponent|Refers to how many times a number multiplied by itself.|เลขยกกำลัง
M|N.|decimal|Relating to a system of counting based on the number ten.|เลขทศนิยม
M|N.|integer|A number with no fractional part.|จำนวนเต็ม
M|N.|percentage|A number or ratio that can be expressed as a fraction of 100.|เปอร์เซ็นต์
M|N.|profit|Income minus all expenses.|กำไร
M|N.|discount|A reduction in price.|การลดราคา
M|N.|ratio|A ratio shows the relative sizes of two or more values.|อัตราส่วน
M|N.|triangle|A 3-sided flat shape with straight sides.|สามเหลี่ยม
M|N.|angle|Two rays meet at a common point.|มุม
M|N.|polygon|A plane shape with straight sides.|รูปหลายเหลี่ยม
M|N.|circumference|The distance around the edge of a circle.|เส้นรอบวง
M|N.|radius|The distance from the center to the circumference of a circle.|รัศมี
M|N.|diameter|A line segment passing through the center, that has endpoints on a circle.|เส้นผ่านศูนย์กลาง
M|N.|pentagon|A 5-sided polygon.|รูปทรง 5 เหลี่ยม
M|N.|hexagon|A 6-sided polygon.|รูปทรง 6 เหลี่ยม
M|N.|octagon|An 8-sided polygon.|รูปทรง 8 เหลี่ยม
M|N.|sphere|A 3-dimensional object shaped like a ball.|ทรงกลม
M|N.|volume|The amount of 3-dimensional space something takes up.|ปริมาณ
M|N.|capacity|The amount that something can hold.|ความจุ
M|N.|protractor|An instrument used in measuring or drawing angles.|ไม้โปรแทรกเตอร์
M|N.|compass|An instrument that shows direction.|เข็มทิศ
S|V.|consume|To eat or drink something.|บริโภค
S|N.|nutrient|A substance that provides nourishments.|สารอาหาร
S|N.|benefit|An advantage or profit gained from something.|ประโยชน์
S|N.|disease|An illness affecting human, animals, or plants often caused by infection.|โรค
S|Adj.|obese|Very fat in a way that is not healthy.|อ้วน
S|N.|vitamin|A group of substances that are needed in order to remain healthy.|วิตามิน
S|N.|saliva|The liquid that is produced in your mouth.|น้ำลาย
S|V.|absorb|To take in something naturally or gradually.|ดูดซับ
S|N.|mixture|A substance made by mixing other substances together.|สารผสม
S|Adj.|homogeneous|Of the same kind; alike.|ซึ่งเป็นเนื้อเดียวกัน, เหมือนกัน
S|Adj.|heterogeneous|Consisting of dissimilar kind or parts.|ต่างชนิดกัน, ไม่เหมือนกัน
S|N.|particle|A minute portion of matter.|อนุภาค
S|N.|magnet|An object capable of producing magnetic field.|แม่เหล็ก
S|V.|evaporate|A process which liquid turns to vapor.|ระเหย
S|N.|conductor|Substances that an electric charge can pass through without difficulty.|ตัวนำไฟฟ้า
S|N.|insulator|Substances that an electric charge cannot pass through.|ฉนวน
S|N.|electricity|The flow of electrical power or charge.|ไฟฟ้า
S|V.|repel|To force something to move away or apart.|ผลักออก
S|V.|attract|To cause something to come toward something else.|ดึงดูด
S|N.|copper|A reddish-brown metal, used especially for making wire and coins.|ทองแดง
S|N.|telescope|A tubular instrument for viewing distant objects.|กล้องโทรทรรศน์
S|N.|satellite|A celestial body orbiting another of larger size.|ดาวเทียม
S|N.|eclipse|The partial or total blocking of light of one celestial object by another.|สุริยุปราคา, จันทรุปราคา
S|Adj.|lunar|Relating to or associated with the moon.|เกี่ยวข้องหรือสัมพันธ์กับดวงจันทร์
S|N.|astronaut|A person who is trained to travel in a spacecraft.|นักบินอวกาศ
S|N.|rocket|A space vehicle or missile.|จรวด, ขีปนาวุธ
S|N.|geologist|A scientist that studies the surface of the Earth and what it is made of.|นักธรณีวิทยา
S|N.|volcano|An opening in the Earth's crust through which lava, ash, and gases erupt.|ภูเขาไฟ
S|N.|magma|Molten rock located under the Earth's surface.|ลาวา
S|N.|fossil|An imprint of an organism preserved in rock.|ซากพืชซากสัตว์ที่เป็นหิน
S|N.|monsoon|The wind that carries heavy rains.|มรสุม
S|N.|breeze|A light and gentle wind.|สายลม
S|N.|anemometer|An instrument that measures wind speed and wind pressure.|เครื่องมือวัดความเร็วลมและแรงดันลม
S|N.|erosion|The movement of soil or rock from one place to another, usually by water or wind.|การพังทลาย
S|N.|earthquake|An intense shaking of Earth's surface.|แผ่นดินไหว
S|N.|tsunami|Giant waves caused by earthquakes or volcanic eruptions under the sea.|สึนามิ
T|N.|government|The governing body of a nation, state or community.|รัฐบาล
T|N.|administration|The management of public affairs; government.|การบริหารราชการแผ่นดิน
T|N.|law|A system of rules made by governments that are enforced through social institutions to govern behavior.|กฎหมาย
T|N.|election|An act of choosing someone by voting.|การเลือกตั้ง
T|V.|vote|To choose who you want to win an election.|ลงคะแนนเสียง
T|N.|candidate|A person who is nominated for election.|ผู้สมัครเลือกตั้ง
T|N.|consumer|A person who buys goods and services.|ผู้บริโภค
T|N.|tax|It refers to the money that the government collects from the people.|ภาษี
T|N.|income|Money that is earned from work, investments, business, etc.|รายได้
T|N.|democracy|An organization or situation in which everyone is treated equally and has equal rights.|ประชาธิปไตย
T|N.|population|All the people living in a particular country, area, or place.|ประชากร
T|N.|empire|A group of countries ruled by a single person, government, or country.|จักรวรรดิ
T|N.|museum|A building where objects of historical, scientific, or artistic interest are kept.|พิพิธภัณฑ์
T|N.|artifact|An object, such as a tool, that was made in the past.|สิ่งประดิษฐ์
T|N.|archive|A collection of historical records relating to a place, organization, or family.|คลังเก็บเอกสาร
T|N.|border|A line that has been agreed to divide one country from another.|ชายแดน
T|N.|peninsula|A piece of land projecting out into a body of water.|คาบสมุทร
T|N.|climate|The general weather conditions usually found in a particular place.|ภูมิอากาศ
T|N.|rainfall|The amount of rain that falls.|ปริมาณน้ำฝน
T|N.|wildlife|Animals living freely in their natural habitat.|สัตว์ป่า
T|N.|entrepreneur|A person who organizes and operates a business.|ผู้ประกอบการ
T|N.|cooperative|A business that is owned and managed by a group of people who also work in it.|สหกรณ์
T|N.|heritage|Something transmitted by or acquired from a predecessor.|มรดก
T|N.|society|A group of people who live in a definable community and share the same culture.|สังคม
T|N.|culture|A set of patterns of human activities within a society or social group.|วัฒนธรรม
T|N.|drought|A long period when there is little or no rain.|ความแห้งแล้ง
L|N.|apartment|A set of rooms for living in.|ห้องเช่า
L|N.|factory|A place where goods are made.|โรงงาน
L|N.|garage|A building where a vehicle is kept.|โรงรถ
L|N.|niece|A daughter of your brother or sister.|หลานสาว
L|N.|nephew|A son of your brother or sister.|หลานชาย
L|N.|family|A group of people related by birth.|ครอบครัว
L|N.|receptionist|A person that deals with client and greet visitors.|พนักงานต้อนรับ
L|N.|detective|A person whose job is to investigate and solve crimes.|นักสืบ
L|N.|thief|A person who steals another property.|หัวขโมย
L|N.|emperor|The male ruler of an empire.|จักรพรรดิ
L|N.|dessert|A dish served as the last course of a meal.|ขนมหวาน
L|N.|menu|A list of dishes available at a restaurant.|รายการอาหาร
L|V.|grill|To cook food over fire or using charcoal.|ย่าง
L|N.|novel|A long story about imaginary character and event.|นิยาย
L|N.|magazine|A type of thin book published on a regular schedule.|นิตยสาร
L|N.|headline|A heading of an article or page in a newspaper or magazine.|พาดหัวข่าว
L|N.|trophy|Something given as a token of victory.|ถ้วยรางวัล
L|N.|cathedral|A Christian church which is also the seat of a bishop.|อาสนวิหาร
L|N.|palace|The official residence of a royal or other high dignitary.|พระราชวัง
L|N.|statue|Image of human or animal carved in marble or bronze.|รูปปั้น
L|N.|canyon|A deep valley typically has a river flowing through it.|หุบเขาลึก
L|N.|creek|A natural stream of water smaller than a river.|ลำห้วย
L|N.|highland|An area of high or mountainous land.|พื้นที่สูง
L|N.|drone|An aircraft that is operated by a remote control.|เครื่องบินที่บังคับด้วยรีโมทคอนโทรล
L|N.|projector|A device that makes an image appear on a screen or other surface.|โปรเจคเตอร์
L|N.|technology|The practical application of science to industry.|เทคโนโลยี
L|N.|rafting|A sport of travelling down a river using an inflatable raft.|การล่องแก่ง
L|N.|cave|A large hole in the side of a hill, or one that is underground.|ถ้ำ
L|N.|sweater|A knitted jacket that covers the top part of your body.|เสื้อกันหนาว`;
const SUB={M:'Maths',S:'Science',T:'Social Studies',L:'Language'};
const WORDS=RAW.split('\n').map(l=>{const [s,p,w,e,t]=l.split('|');return{s:SUB[s],p,w,e,t}});
const $=id=>document.getElementById(id);
let players=[],turns=[],ti=0,rounds=5,answered=false;

function drawNames(){const n=+$('np').value;const old=[...document.querySelectorAll('#names input')].map(i=>i.value);
$('names').innerHTML=Array.from({length:n},(_,i)=>`<label for="pn${i}">ชื่อผู้เล่นคนที่ ${i+1}</label><input id="pn${i}" maxlength="16" placeholder="ชื่อ" value="${(old[i]||'').replace(/"/g,'')}">`).join('')}
$('np').onchange=drawNames;drawNames();

function mask(e,w){const stem=w.length>5?w.slice(0,w.length-2):w;return e.replace(new RegExp('\\b'+stem+'\\w*','gi'),'_____')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

$('start').onclick=()=>{
 const n=+$('np').value;rounds=+$('nr').value;
 players=Array.from({length:n},(_,i)=>({name:($('pn'+i).value.trim()||'ผู้เล่น '+(i+1)),score:0}));
 const pool=shuffle(WORDS);turns=[];
 for(let r=0;r<rounds;r++)players.forEach((_,p)=>turns.push({p,r,word:pool[turns.length]}));
 ti=0;$('setup').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');show()};

function chips(){const cur=turns[ti]&&turns[ti].p;$('chips').innerHTML=players.map((p,i)=>`<span class="chip ${i===cur&&!answered?'on':''}">${esc(p.name)}: ${p.score}</span>`).join('')}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function show(){
 answered=false;const t=turns[ti],w=t.word;
 $('who').textContent=`ตาของ ${players[t.p].name} แล้วครับ! 🐝`;
 $('prog').textContent=`รอบที่ ${t.r+1} จาก ${rounds}`;
 $('h-sub').textContent=w.s;$('h-pos').textContent='('+w.p+')';
 $('h-en').textContent=mask(w.e,w.w);$('h-th').textContent=w.t;
 $('slots').classList.add('hidden');$('slots').textContent='_ '.repeat(w.w.length).trim();
 $('fb').innerHTML='';$('ans').value='';$('ans').disabled=false;
 $('check').disabled=false;$('len').disabled=false;$('answerBox').classList.remove('hidden');$('next').classList.add('hidden');
 chips();$('ans').focus()}

function submit(){
 if(answered)return;const t=turns[ti],w=t.word.w,a=$('ans').value.trim().toLowerCase();
 if(!a){$('ans').focus();return}
 answered=true;$('ans').disabled=true;$('check').disabled=true;$('len').disabled=true;
 if(a===w){players[t.p].score++;
  $('fb').innerHTML=`<div class="fb ok">เยี่ยมมาก! สะกดถูกต้อง <b>${w}</b> 🎉 +1 คะแนน</div>`}
 else{$('fb').innerHTML=`<div class="fb bad">เกือบแล้ว สู้ๆ นะ! 💪 คำที่ถูกต้องคือ <b>${w}</b> (${w.split('').join(' - ')})</div>`}
 const last=ti===turns.length-1;$('next').textContent=last?'ดูผลคะแนน 🏆':'ไปต่อ';$('next').classList.remove('hidden');chips();$('next').focus()}

$('check').onclick=submit;
$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('len').onclick=()=>$('slots').classList.remove('hidden');
$('next').onclick=()=>{ti++;ti<turns.length?show():finish()};

function finish(){
 $('game').classList.add('hidden');$('end').classList.remove('hidden');
 const s=players.slice().sort((a,b)=>b.score-a.score),top=s[0].score,wins=s.filter(p=>p.score===top);
 $('winner').innerHTML=players.length===1?`🏆 ${esc(s[0].name)} ได้ ${top} จาก ${rounds} คะแนน!`:
  wins.length>1?`🤝 เสมอกัน! ${wins.map(p=>esc(p.name)).join(' และ ')} ได้ ${top} คะแนน`:`🏆 ผู้ชนะคือ ${esc(s[0].name)}! ยินดีด้วยครับ 🎉`;
 $('board').innerHTML=s.map((p,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(p.name)}</td><td>${p.score} / ${rounds}</td></tr>`).join('')}
$('again').onclick=()=>{$('end').classList.add('hidden');$('setup').classList.remove('hidden')};
</script></body></html>
