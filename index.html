<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spelling Bee Master - Grade 6</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Sarabun','Comic Sans MS',sans-serif;background:#FFF9C4;color:#333;text-align:center;margin:0;padding:20px}
.container{max-width:600px;margin:0 auto 20px;background:#fff;border-radius:20px;padding:30px;box-shadow:0 8px 16px rgba(0,0,0,.2);border:5px solid #FBC02D}
h1{color:#F57F17;font-size:2.2em;margin-bottom:10px}
input,button{padding:12px;margin:8px;border-radius:8px;border:2px solid #FBC02D;font-size:16px;font-family:inherit}
button{background:#FBC02D;color:#333;cursor:pointer;font-weight:bold;transition:.3s}
button:hover{background:#F9A825;color:#fff}
.hidden{display:none}
.hint-box{background:#E3F2FD;padding:20px;border-radius:12px;margin:20px 0;text-align:left;border-left:5px solid #2196F3}
.player-turn{font-size:24px;font-weight:bold;color:#D32F2F;margin-bottom:10px}
.score-board{background:#E8F5E9;padding:20px;border-radius:12px;text-align:left;margin-top:20px}
.audio-btn{background:#4CAF50;color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer}
</style>
</head>
<body>
<div class="container" id="setup-screen">
<h1>🐝 Spelling Bee Master 🐝</h1>
<p>ยินดีต้อนรับนักเรียน Grade 6 ทุกคน!</p>
<div id="player-setup">
<label>จำนวนผู้เล่น: <input type="number" id="player-count" min="1" max="10" value="2"></label><br>
<button onclick="generateNameInputs()">ตกลง</button>
</div>
<div id="names-setup" class="hidden"></div>
<div id="game-options" class="hidden">
<label>จำนวนรอบที่เล่น: <input type="number" id="rounds" min="1" max="10" value="3"></label><br>
<button onclick="startGame()">เริ่มเกมเลย! 🎉</button>
</div>
</div>

<div class="container hidden" id="game-screen">
<h1>🐝 ทายคำศัพท์! 🐝</h1>
<div class="player-turn" id="turn-display"></div>
<p id="round-display"></p>
<div class="hint-box">
<p><strong>📚 Subject:</strong> <span id="hint-subject"></span></p>
<p><strong>🔠 Part of Speech:</strong> <span id="hint-pos"></span></p>
<p><strong>🇬🇧 English Def:</strong> <span id="hint-eng"></span></p>
<p><strong>🇹🇭 Thai Def:</strong> <span id="hint-thai"></span></p>
<button class="audio-btn" onclick="playAudio()">🔊 ฟังเสียงอ่าน</button>
</div>
<input type="text" id="answer-input" placeholder="พิมพ์คำศัพท์ที่นี่..." autocomplete="off" autocapitalize="off" spellcheck="false">
<button onclick="checkAnswer()">ตอบ!</button>
<p id="feedback" style="font-weight:bold;font-size:18px;margin-top:15px"></p>
<button id="next-btn" class="hidden" onclick="nextTurn()">คนต่อไป 👉</button>
</div>

<div class="container hidden" id="result-screen">
<h1>🏆 สรุปคะแนน 🏆</h1>
<div class="score-board" id="final-scores"></div>
<h2 id="winner-announcement" style="color:#D32F2F;margin-top:20px"></h2>
<button onclick="location.reload()">เล่นใหม่อีกครั้ง!</button>
</div>

let players=[],scores=[],currentRound=1,totalRounds=3,currentPlayerIndex=0,currentWord={},answered=false,deck=[];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mask(e,w){const s=w.length>5?w.slice(0,w.length-2):w;return e.replace(new RegExp('\\b'+s+'\\w*','gi'),'_____')}

function generateNameInputs(){
 const count=Math.min(10,Math.max(1,+document.getElementById('player-count').value||1));
 document.getElementById('player-count').value=count;
 let html='<h3>กรอกชื่อผู้เล่น:</h3>';
 for(let i=0;i<count;i++)html+=`<input type="text" id="player-name-${i}" placeholder="ชื่อผู้เล่นคนที่ ${i+1}"><br>`;
 document.getElementById('names-setup').innerHTML=html;
 document.getElementById('names-setup').classList.remove('hidden');
 document.getElementById('game-options').classList.remove('hidden');
 document.getElementById('player-setup').classList.add('hidden');
}
function startGame(){
 const count=+document.getElementById('player-count').value;
 for(let i=0;i<count;i++){
  const n=document.getElementById(`player-name-${i}`).value.trim()||`Player ${i+1}`;
  players.push(n);scores.push(0);
 }
 totalRounds=Math.min(10,Math.max(1,parseInt(document.getElementById('rounds').value)||1));
 deck=shuffle(vocabList);
 document.getElementById('setup-screen').classList.add('hidden');
 document.getElementById('game-screen').classList.remove('hidden');
 loadTurn();
}

 const fb=document.getElementById('feedback'),inp=document.getElementById('answer-input');
 fb.innerText='';inp.value='';inp.disabled=false;
 document.getElementById('next-btn').classList.add('hidden');

 document.getElementById('round-display').innerText=`รอบที่ ${currentRound} จาก ${totalRounds}`;
 if(!deck.length)deck=shuffle(vocabList);
 currentWord=deck.pop();
 document.getElementById('hint-subject').innerText=currentWord.subject;
 document.getElementById('hint-pos').innerText=currentWord.pos;
 document.getElementById('hint-eng').innerText=mask(currentWord.eng,currentWord.word);
 document.getElementById('hint-thai').innerText=currentWord.thai;
 inp.focus();
}
function playAudio(){
 if(!('speechSynthesis' in window))return;
 const msg=new SpeechSynthesisUtterance(currentWord.word);
 msg.lang='en-US';window.speechSynthesis.cancel();window.speechSynthesis.speak(msg);
}
function checkAnswer(){
 if(answered)return;
 const inp=document.getElementById('answer-input'),answer=inp.value.trim().toLowerCase(),fb=document.getElementById('feedback');
 if(!answer){inp.focus();return}
 answered=true;inp.disabled=true;
 if(answer===currentWord.word){
  fb.innerText="🎉 ยอดเยี่ยมมาก! สะกดถูกต้อง รับไปเลย 1 คะแนน!";fb.style.color="green";scores[currentPlayerIndex]++;
 }else{
  fb.innerText=`💪 ไม่เป็นไรนะ พยายามได้ดีมาก! คำที่ถูกต้องสะกดว่า: ${currentWord.word.toUpperCase()}`;fb.style.color="red";
 }
 document.getElementById('next-btn').classList.remove('hidden');
}
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 const g=document.getElementById('game-screen');
 if(g.classList.contains('hidden'))return;
 answered?nextTurn():checkAnswer();
});
function nextTurn(){
 currentPlayerIndex++;
 if(currentPlayerIndex>=players.length){currentPlayerIndex=0;currentRound++}
 currentRound>totalRounds?endGame():loadTurn();
}
function endGame(){
 document.getElementById('game-screen').classList.add('hidden');
 document.getElementById('result-screen').classList.remove('hidden');
 let max=-1,winners=[],html='<ul>';
 for(let i=0;i<players.length;i++){
  html+=`<li><strong>${players[i]}</strong> : ${scores[i]} คะแนน</li>`;
  if(scores[i]>max){max=scores[i];winners=[players[i]]}else if(scores[i]===max)winners.push(players[i]);
 }
 document.getElementById('final-scores').innerHTML=html+'</ul>';
 document.getElementById('winner-announcement').innerText=`🏆 ผู้ชนะคือ: ${winners.join(', ')} 🏆`;
}
</script>
</body>
</html>
